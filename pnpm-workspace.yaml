# Reject packages published within the last 8h (supply-chain guard; pnpm >=11 default is 24h).
# NOTE: was temporarily lowered from the default because Next.js 16.3.2 had just been
# released when pnpm 11 was adopted. See AGENTS.md before changing.
minimumReleaseAge: 480

# Build scripts approved explicitly (pnpm >=11 blocks them by default)
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "brace-expansion@<1.1.13": ">=1.1.13 <2"
  "brace-expansion@>=4.0.0 <5.0.5": ">=5.0.5"
  "drizzle-orm@<0.45.2": ">=0.45.2"
  "esbuild@<=0.24.2": ">=0.25.0"
  "flatted@<=3.4.1": ">=3.4.2"
  "picomatch@<2.3.2": ">=2.3.2"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4"
  "postcss@<8.5.10": ">=8.5.10"
